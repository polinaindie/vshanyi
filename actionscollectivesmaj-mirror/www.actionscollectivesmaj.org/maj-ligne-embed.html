<section class="flex flex--thick_gapped gallerie svelte-abwfhn ready first"><!--[!--><!--]--> <!--[!--><div class="col col--12of12 svelte-abwfhn" style="--color: #BDB98D; --scroll: 0; --location: 0; --last: 0;"><!----><!--[--><aside class="progress flex flex--column svelte-abwfhn"><small aria-hidden="true">Scroll to explore</small> <progress max="33" value="0" class="svelte-abwfhn">0 / 34</progress></aside><!--]--> <!--[--><figure class="slider svelte-9ptg6i" style="--view: auto;"><!----><ol class="list--nostyle slider__container svelte-abwfhn"><li class="slide first svelte-abwfhn active"><!--[--><!--[5--><p><!--[--><!--[--><!--[!--><!---->Even before the term “feminist” was coined, women were claiming their place in politics and society as in the art world. From the first Suffragette campaigns of the late&nbsp;1800s to the rise of feminism in the&nbsp;1960s, which coincided with the Quiet Revolution, women fought for emancipation on many fronts. The activism of lesbian, Indigenous, and racialized women challenged white, heterosexual, middle-class feminism. Today, intersectional and plural feminisms are central to the&nbsp;discussion.<!----><!--]--><!--]--><!--]--></p><!--]--><!--[5--><p><!--[--><!--[--><!--[!--><!---->This timeline explores changing feminist perspectives in society and in art over the past 80&nbsp;years.  Linked by a critical and political discourse, the works featured in this timeline are anchored to particular historical moments. While some of them address a specific cause from a feminist perspective, others are <!----><!--]--><!--]--><!--[--><!--[!--><!---->associated with events<!----><!--]--><!--]--><!--[--><!--[!--><!----> that impacted the status of women more broadly. The chronology also highlights historical exhibitions that played a considerable role in giving women’s art greater&nbsp;visibility.<!----><!--]--><!--]--><!--]--></p><!--]--><!--]--><!----> <figure class="svelte-abwfhn"><!--[--><!--[--><!--[!--><picture><!--[!--><source srcse <svg aria-label="Prochain" width="47" height="31" viewBox="0 0 47 31"><path d="M46.8 16.2008V18.4008L46 18.6008C39.5 19.8008 34.8 24.9008 34.8 30.7008H32.8C32.8 25.5008 36 20.9008 40.8 18.3008H9.30005C4.30005 18.3008 0.300049 14.3008 0.300049 9.30078C0.300049 4.30078 4.30005 0.300781 9.30005 0.300781H20.9V2.30078H9.30005C5.40005 2.30078 2.30005 5.40078 2.30005 9.30078C2.30005 13.2008 5.40005 16.3008 9.30005 16.3008H40.8C36 13.8008 32.8 9.10078 32.8 3.90078H34.8C34.8 9.70078 39.5 14.8008 46 16.0008L46.8 16.2008Z"></path></svg><!--]--><!----> <p>Visit the next time line</p> <hr class="svelte-abwfhn"> <p>Redefining Art</p></a></li></ol><!----></figure> <!--[!--><!--]--> <!--[!--><!--]--><!--]--><!----><!----> <!--[!--><!--]--></div> <h1 class="annee svelte-abwfhn" role="navigation"><button class="previous button--none svelte-abwfhn"><!--[2--><svg aria-label="Retour" width="30" height="30" viewBox="0 0 30 30"><path d="M29.128 15.781V13.722L28.436 13.574C25.335 12.8975 22.5573 11.184 20.5613 8.71623C18.5653 6.24846 17.4703 3.17392 17.457 0L15.707 0C15.7203 2.86491 16.5162 5.67173 18.0086 8.11726C19.501 10.5628 21.6333 12.5541 24.175 13.876H0V15.626H24.175C21.6336 16.9479 19.5017 18.9388 18.0093 21.384C16.5169 23.8291 15.7208 26.6354 15.707 29.5H17.457C17.4708 26.3266 18.566 23.2526 20.562 20.7854C22.558 18.3182 25.3354 16.6052 28.436 15.929L29.128 15.781Z"></path></svg><!--]--><!----></button> 1944 <button class="next button--none svelte-abwfhn"><!--[2--><svg aria-label="Prochain" width="30" height="30" viewBox="0 0 30 30"><path d="M29.128 15.781V13.722L28.436 13.574C25.335 12.8975 22.5573 11.184 20.5613 8.71623C18.5653 6.24846 17.4703 3.17392 17.457 0L15.707 0C15.7203 2.86491 16.5162 5.67173 18.0086 8.11726C19.501 10.5628 21.6333 12.5541 24.175 13.876H0V15.626H24.175C21.6336 16.9479 19.5017 18.9388 18.0093 21.384C16.5169 23.8291 15.7208 26.6354 15.707 29.5H17.457C17.4708 26.3266 18.566 23.2526 20.562 20.7854C22.558 18.3182 25.3354 16.6052 28.436 15.929L29.128 15.781Z">< <script>
(() => {
	const root = document.querySelector(".gallerie");
	const track = document.querySelector(".slider__container");
	const progressEl = document.querySelector(".gallerie progress");
	const slides = track
		? [...track.children].filter(
				(el) => el.classList.contains("slide") && !el.classList.contains("first")
			)
		: [];
	if (!track || !slides.length) return;

	let maxTravel = 0;
	let currentProgress = 0;

	const report = () => {
		maxTravel = Math.max(0, track.scrollWidth - window.innerWidth);
		parent.postMessage(
			{
				source: "vshanuy-ligne-embed",
				type: "metrics",
				maxTravel,
				slideCount: slides.length,
				scrollWidth: track.scrollWidth,
			},
			"*"
		);
	};

	const applyProgress = (progressRatio) => {
		currentProgress = Math.min(1, Math.max(0, Number(progressRatio) || 0));
		const x = currentProgress * maxTravel;
		track.style.transform = "translate3d(" + (-x) + "px, 0, 0)";
		const idx = Math.min(
			slides.length - 1,
			Math.round(currentProgress * Math.max(0, slides.length - 1))
		);
		if (progressEl) {
			progressEl.max = Math.max(1, slides.length - 1);
			progressEl.value = idx;
			progressEl.textContent = idx + " / " + slides.length;
		}
		root && root.classList.remove("first");
		slides.forEach((s, i) => {
			s.classList.toggle("active", i === idx);
			s.classList.toggle("left", i < idx);
			s.classList.toggle("right", i > idx);
		});
	};

	window.addEventListener("message", (event) => {
		const data = event.data;
		if (!data || data.source !== "vshanuy-ligne") return;
		if (data.type === "measure") report();
		if (data.type === "progress") applyProgress(data.progress);
	});

	document.querySelector(".slide.first .next")?.addEventListener("click", () => {
		const step = 1 / Math.max(1, slides.length - 1);
		parent.postMessage(
			{ source: "vshanuy-ligne-embed", type: "nudge", progress: Math.min(1, currentProgress + step) },
			"*"
		);
	});

	/* Eager-load first artworks so the opening frame isn't empty cream */
	slides.slice(0, 8).forEach((slide) => {
		slide.querySelectorAll("img").forEach((img) => {
			img.loading = "eager";
			img.fetchPriority = "high";
		});
	});

	root?.classList.remove("first");
	applyProgress(0);

	/* Forward wheel to parent — iframe eats scroll otherwise */
	window.addEventListener(
		"wheel",
		(event) => {
			parent.postMessage(
				{
					source: "vshanuy-ligne-embed",
					type: "wheel",
					deltaY: event.deltaY,
				},
				"*"
			);
			event.preventDefault();
		},
		{ passive: false }
	);

	let touchY = null;
	window.addEventListener(
		"touchstart",
		(event) => {
			touchY = event.touches[0]?.clientY ?? null;
		},
		{ passive: true }
	);
	window.addEventListener(
		"touchmove",
		(event) => {
			if (touchY == null) return;
			const y = event.touches[0]?.clientY;
			if (y == null) return;
			const deltaY = touchY - y;
			touchY = y;
			parent.postMessage(
				{ source: "vshanuy-ligne-embed", type: "wheel", deltaY },
				"*"
			);
			event.preventDefault();
		},
		{ passive: false }
	);
	window.addEventListener(
		"touchend",
		() => {
			touchY = null;
		},
		{ passive: true }
	);

	const ready = () => {
		report();
		applyProgress(currentProgress);
	};

	if (document.fonts && document.fonts.ready) document.fonts.ready.then(ready);
	else ready();
	window.addEventListener("load", ready);
	window.addEventListener("resize", ready);
	track.querySelectorAll("img").forEach((img) => {
		if (!img.complete) img.addEventListener("load", report, { once: true });
	});
})();
</script>
